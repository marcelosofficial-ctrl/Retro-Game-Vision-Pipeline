name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Verify installed dependencies
        run: python -m pip check
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check publication boundary
        run: python scripts/prepublish_check.py
      - name: Run synthetic end-to-end demo
        run: python -m retro_resale_pipeline.demo
