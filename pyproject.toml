[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retro-game-resale-pipeline-demo"
version = "0.2.0"
description = "Synthetic public demo of an evidence-first retro-game resale pipeline"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
